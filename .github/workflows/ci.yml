name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Build deployment image
        run: docker build --tag bitcoin-math-lab-backend:ci .

      - name: Start deployment image
        run: docker run --detach --name bml-backend-ci --publish 127.0.0.1:8000:8000 bitcoin-math-lab-backend:ci

      - name: Smoke test deployment image
        run: python scripts/smoke_test.py --api-base-url http://127.0.0.1:8000

      - name: Stop deployment image
        if: always()
        run: docker rm --force bml-backend-ci
