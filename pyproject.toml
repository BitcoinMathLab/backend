[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-math-lab-backend"
version = "0.1.0"
description = "Product API and orchestration for Bitcoin Math Lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bitcoinmathlab-bitclone @ git+https://github.com/BitcoinMathLab/bitclone.git@d2867582ec2a3d1d640f7d2f6f677380cc5b8dab",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
include = ["bml_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
